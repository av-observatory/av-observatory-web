name: Deploy AV Observatory to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate policy snapshot
        run: node scripts/validate-policy-data.mjs

      - name: Validate bill snapshot
        run: node scripts/validate-legislation-data.mjs

      - name: Validate operator profiles
        run: node scripts/validate-manufacturer-data.mjs

      - name: Validate latest-version SGO reports
        run: python3 scripts/validate-sgo-snapshot.py

      - name: Validate enriched SGO crash and rate data
        run: python3 scripts/validate-safety-rates.py

      - name: Validate AV 311 and Waymo map
        run: |
          python3 scripts/refresh-311.py --check
          python3 scripts/build-waymo-explorer.py --check

      - name: Validate CSV companions
        run: python3 scripts/export-data-csv.py --check

      - name: Build static site
        env:
          NEXT_PUBLIC_CONTACT_FORM_URL: ${{ vars.CONTACT_FORM_URL }}
          NEXT_PUBLIC_POLICY_R2_URL: ${{ vars.POLICY_R2_PUBLIC_URL }}
          NEXT_PUBLIC_LEGISLATION_R2_URL: ${{ vars.LEGISLATION_R2_PUBLIC_URL }}
        run: npm run build

      # The parent data repository publishes the validated site snapshot to R2.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
