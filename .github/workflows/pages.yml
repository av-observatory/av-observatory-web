name: Deploy AV Observatory to GitHub Pages
# S2 Census explorer deploy
# Q2 2026 data refresh

on:
  push:
    branches: ["main"]
  # Commits pushed by data-refresh bots (GITHUB_TOKEN) do not trigger push workflows,
  # so rebuild daily after the 10:17, 12:17 and 14:35 UTC refreshes to publish them.
  schedule:
    - cron: "50 15 * * *"
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Refresh primary-source NHTSA investigations and recalls
        run: |
          if python3 scripts/refresh-nhtsa-oversight.py; then
            python3 scripts/export-data-csv.py
          else
            echo "::warning::Could not refresh NHTSA bulk data; publishing explicitly labeled fallback datasets."
          fi

      - name: Validate NHTSA editorial summary quality
        run: python3 scripts/test-nhtsa-editorial.py

      - name: Validate policy snapshot
        run: node scripts/validate-policy-data.mjs

      - name: Validate bill snapshot
        run: node scripts/validate-legislation-data.mjs

      - name: Validate operator profiles
        run: node scripts/validate-manufacturer-data.mjs

      - name: Validate latest-version SGO reports
        run: python3 scripts/validate-sgo-snapshot.py

      - name: Validate enriched SGO crash and rate data
        run: python3 scripts/validate-safety-rates.py

      - name: Validate AV 311 and Waymo map
        run: |
          python3 scripts/refresh-311.py --check
          python3 scripts/build-waymo-explorer.py --check

      - name: Validate CSV companions
        run: python3 scripts/export-data-csv.py --check

      - name: Generate social preview
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/build-social-preview.py

      - name: Build static site
        env:
          NEXT_PUBLIC_CONTACT_FORM_URL: ${{ vars.CONTACT_FORM_URL }}
          NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
          NEXT_PUBLIC_POLICY_R2_URL: ${{ vars.POLICY_R2_PUBLIC_URL }}
          NEXT_PUBLIC_LEGISLATION_R2_URL: ${{ vars.LEGISLATION_R2_PUBLIC_URL }}
        run: npm run build

      # The parent data repository publishes the validated site snapshot to R2.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
