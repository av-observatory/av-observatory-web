name: Extract Florida legislature data (bills, authors, votes, digests)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "extract (matrix by session, then merge), smoke (time-boxed, no commit), fetch (save URLs from args under probe/), merge (only merge parts)"
        default: "extract"
      args:
        description: "extra args for the extractor (smoke/extract) or space-separated URLs (fetch)"
        default: ""

permissions:
  contents: write

concurrency:
  group: extract-fl-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  tools:
    if: ${{ inputs.mode == 'smoke' || inputs.mode == 'fetch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch listed URLs
        if: ${{ inputs.mode == 'fetch' }}
        run: |
          mkdir -p data-state/states/FL/probe
          P=data-state/states/FL/probe
          n=0
          for u in $ARGS; do
            n=$((n+1)); f="f_$(date +%s)_$n.html"
            for try in 1 2 3 4; do
              code=$(curl -sS -L --max-time 60 -A "Mozilla/5.0 (StateTrack research)" -o "$P/$f" -w "%{http_code}" "$u")
              [ "$code" != "429" ] && break; sleep 20
            done
            echo "$f $code $u" | tee -a $P/log2.txt
            sleep 3
          done
          for i in 1 2 3 4 5; do COMMIT_PATH=data-state/states/FL bash scripts/commit-ledgers.sh "FL fetch probe" && break; sleep 5; done
        env:
          ARGS: ${{ inputs.args }}
      - name: Smoke (time-boxed, no commit)
        if: ${{ inputs.mode == 'smoke' }}
        run: timeout 900 python3 -u scripts/extract-fl-legislature.py $ARGS || echo "exit $?"
        env:
          ARGS: ${{ inputs.args }}

  extract:
    if: ${{ inputs.mode == 'extract' }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        include:
          - {sessions: "2025", shard: ""}
          - {sessions: "2026", shard: ""}
          - {sessions: "2025A,2025B,2025C,2026D,2026E,2026F", shard: ""}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pdftotext
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Extract sessions ${{ matrix.sessions }} ${{ matrix.shard }}
        run: bash scripts/live-commit.sh python3 -u scripts/extract-fl-legislature.py --part --resume --sessions "${{ matrix.sessions }}" --shard "${{ matrix.shard }}" $ARGS
        env:
          COMMIT_PATH: data-state/states/FL
          ARGS: ${{ inputs.args }}
      - name: Commit the parts
        if: ${{ always() }}
        run: for i in 1 2 3 4 5; do COMMIT_PATH=data-state/states/FL bash scripts/commit-ledgers.sh "Florida legislature data (part ${{ matrix.sessions }} ${{ matrix.shard }})" && break; sleep 5; done

  merge:
    if: ${{ !cancelled() && (inputs.mode == 'extract' || inputs.mode == 'merge') }}
    needs: [extract]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
      - name: Merge parts into the final files
        run: python3 -u scripts/extract-fl-legislature.py --merge
      - name: Commit the merged files
        run: for i in 1 2 3 4 5; do COMMIT_PATH=data-state/states/FL bash scripts/commit-ledgers.sh "Florida legislature data" && break; sleep 5; done
