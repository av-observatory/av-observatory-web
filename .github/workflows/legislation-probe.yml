name: Probe state bill-list endpoints
on:
  push:
    paths:
      - "scripts/probe-state-lists.py"
      - ".github/workflows/legislation-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/probe-state-lists.py
