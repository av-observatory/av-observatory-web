name: Test state adapters and probe endpoints
on:
  push:
    paths:
      - "scripts/probe-state-lists.py"
      - "scripts/test-adapters.py"
      - "scripts/bill_enumerators.py"
      - ".github/workflows/legislation-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mdbtools (New Jersey database)
        run: sudo apt-get install -y -q mdbtools > /dev/null
      - name: Run every adapter without writing ledgers
        env:
          NY_SENATE_API_KEY: ${{ secrets.NY_SENATE_API_KEY }}
        run: python3 scripts/test-adapters.py
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/probe-state-lists.py
