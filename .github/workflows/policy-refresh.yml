name: Refresh policy tracker from official sources

on:
  schedule:
    - cron: "23 8 */3 * *"   # every 3 days, so no dataset is older than 5 days
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List candidates only; no model calls, no commits"
        type: boolean
        default: false
      probe:
        description: "Diagnostic: test every source URL with each fetch method"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: website-data-writers
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ inputs.probe == true }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          pip install --quiet playwright
          playwright install --with-deps chromium
      - run: |
          pip install --quiet requests
          python3 scripts/probe-model.py
      - run: python3 scripts/probe-fetch.py

  refresh:
    if: ${{ inputs.probe != true }}
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Check configuration
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not configured (gh secret set OPENAI_API_KEY)."
            exit 1
          fi

      - name: Install fetch tools (headless browser, PDF text, OpenAI HTTP API)
        run: |
          pip install --quiet pypdf playwright
          playwright install --with-deps chromium

      - name: Safety tests
        run: python3 scripts/test-policy-refresh.py

      - name: Dry run (list candidates)
        if: ${{ inputs.dry_run == true }}
        run: python3 scripts/refresh-policy.py --dry-run

      - name: Refresh policy tracker
        if: ${{ inputs.dry_run != true }}
        run: python3 scripts/refresh-policy.py --open-issues

      - name: Restore source-verified summaries and research source gaps
        if: ${{ inputs.dry_run != true }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          POLICY_EDITORIAL_MAX_NEW: 25
        run: |
          python3 scripts/ai-policy-editorial.py
          python3 scripts/audit-editorial-quality.py

      - name: Validate and rebuild CSV companions
        if: ${{ inputs.dry_run != true }}
        run: |
          node scripts/validate-policy-data.mjs
          python3 scripts/export-data-csv.py
          python3 scripts/export-data-csv.py --check

      - name: Commit and deploy
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "av-observatory-bot"
          git config user.email "bot@av-observatory.org"
          git add public/data data-state
          if git diff --cached --quiet; then
            echo "No policy changes."
            exit 0
          fi
          git commit -m "data: refresh policy tracker from official sources"
          bash scripts/push-main.sh main
          gh workflow run pages.yml --ref main
