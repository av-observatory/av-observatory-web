name: Extract Oregon legislature data (bills, authors, votes, digests)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe or extract"
        default: "extract"

permissions:
  contents: write

concurrency:
  group: extract-or-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Probe
        if: inputs.mode == 'probe'
        run: |
          bash scripts/probe-or.sh
          COMMIT_PATH=data-state/states/OR bash scripts/commit-ledgers.sh "OR probe"
      - name: Extract
        if: inputs.mode != 'probe'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          (
            while sleep 120; do
              git add data-state/states/OR
              git commit -q -m "OR progress $(date -u +%H:%M)" || continue
              git pull -q --rebase --autostash origin main && git push -q origin HEAD:main || true
            done
          ) &
          LIVE=$!
          set +e
          python3 scripts/extract-or-legislature.py
          code=$?
          kill "$LIVE" 2>/dev/null
          wait "$LIVE" 2>/dev/null
          exit $code
      - name: Commit the extracted files
        if: always() && inputs.mode != 'probe'
        run: |
          ls -l data-state/states/OR
          COMMIT_PATH=data-state/states/OR bash scripts/commit-ledgers.sh "Oregon legislature data"
