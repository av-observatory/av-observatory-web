name: Refresh AV state legislation database
# Open States manual trigger marker

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/refresh-legislation.py"
      - ".github/workflows/legislation-refresh.yml"
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.POLICY_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.POLICY_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.POLICY_R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.POLICY_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - name: Report refresh configuration
        if: ${{ env.R2_BUCKET == '' || env.R2_ACCOUNT_ID == '' || env.AWS_ACCESS_KEY_ID == '' || env.AWS_SECRET_ACCESS_KEY == '' || env.OPENSTATES_API_KEY == '' }}
        run: echo '::warning::Legislation refresh skipped. Configure the OPENSTATES_API_KEY secret.'
      - name: Search current sessions and rebuild Open States bill database
        if: ${{ env.OPENSTATES_API_KEY != '' }}
        run: python3 scripts/refresh-legislation.py public/data/legislation_tracker.json
      - name: Validate refreshed index
        if: ${{ env.OPENSTATES_API_KEY != '' }}
        run: node scripts/validate-legislation-data.mjs public/data/legislation_tracker.json
      - name: Refresh CSV companions
        if: ${{ env.OPENSTATES_API_KEY != '' }}
        run: python3 scripts/export-data-csv.py
      - name: Commit refreshed Open States database
        if: ${{ env.OPENSTATES_API_KEY != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/legislation_tracker.json public/data/legislation_tracker_*.csv
          if git diff --cached --quiet; then
            echo "No legislation changes to commit"
          else
            git commit -m "Refresh Open States state legislation database"
            git push
          fi
      - name: Publish and verify versioned bill index
        if: ${{ env.R2_BUCKET != '' && env.R2_ACCOUNT_ID != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' && env.OPENSTATES_API_KEY != '' }}
        run: python3 scripts/publish-r2-data.py legislation --file public/data/legislation_tracker.json
