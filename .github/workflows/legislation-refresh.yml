name: Refresh AV legislative bill index

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.POLICY_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.POLICY_R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ACCOUNT_ID: ${{ vars.POLICY_R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.POLICY_R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - name: Report refresh configuration
        if: ${{ env.R2_BUCKET == '' || env.R2_ACCOUNT_ID == '' || env.AWS_ACCESS_KEY_ID == '' || env.AWS_SECRET_ACCESS_KEY == '' || env.LEGISCAN_API_KEY == '' }}
        run: echo '::warning::Legislation refresh skipped. Configure R2 settings and the LEGISCAN_API_KEY secret.'
      - name: Search current sessions and resolve bill details
        if: ${{ env.R2_BUCKET != '' && env.R2_ACCOUNT_ID != '' && env.LEGISCAN_API_KEY != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        run: python3 scripts/refresh-legislation.py /tmp/legislation_tracker.json
      - name: Validate refreshed index
        if: ${{ env.R2_BUCKET != '' && env.R2_ACCOUNT_ID != '' && env.LEGISCAN_API_KEY != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        run: node scripts/validate-legislation-data.mjs /tmp/legislation_tracker.json
      - name: Publish and verify versioned bill index
        if: ${{ env.R2_BUCKET != '' && env.R2_ACCOUNT_ID != '' && env.LEGISCAN_API_KEY != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        run: python3 scripts/publish-r2-data.py legislation --file /tmp/legislation_tracker.json
