name: Recover AV Observatory Pages deployment
# Temporary independent deployment path: keeps UI releases publishing if the
# primary scheduled data-refresh/validation workflow is blocked.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-recovery-manual"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Compile production static site
        env:
          NEXT_PUBLIC_CONTACT_FORM_URL: ${{ vars.CONTACT_FORM_URL }}
          NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
          NEXT_PUBLIC_POLICY_R2_URL: ${{ vars.POLICY_R2_PUBLIC_URL }}
          NEXT_PUBLIC_LEGISLATION_R2_URL: ${{ vars.LEGISLATION_R2_PUBLIC_URL }}
        run: npm run build
      - name: Confirm static output exists
        run: |
          test -f out/policy/state-legislation/index.html
          test -f out/deployment-check-2026-10-14.json
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
