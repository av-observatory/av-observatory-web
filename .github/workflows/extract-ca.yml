name: Extract California legislature data (bills, authors, votes, digests)

on:
  workflow_dispatch:
    inputs:
      year:
        description: "pubinfo file year"
        default: "2025"

permissions:
  contents: write

concurrency:
  group: extract-ca-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download California's bulk file
        run: |
          curl -sS -L --fail --retry 3 -A "Mozilla/5.0" -o /tmp/pubinfo.zip "https://downloads.leginfo.legislature.ca.gov/pubinfo_${{ inputs.year }}.zip"
          ls -l /tmp/pubinfo.zip
      - name: Extract
        run: python3 scripts/extract-ca-legislature.py --zip /tmp/pubinfo.zip --year "${{ inputs.year }}"
      - name: Commit the extracted files
        run: |
          ls -l data-state/states/CA
          COMMIT_PATH=data-state/states/CA bash scripts/commit-ledgers.sh "California legislature data"
