name: Refresh Citizen AV Complaints

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/refresh-311.yml"
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: website-data-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch San Francisco AV 311 and Austin resident reports
        run: |
          python3 scripts/refresh-311.py
          python3 scripts/refresh-311.py --check
          python3 scripts/export-data-csv.py
          python3 scripts/export-data-csv.py --check
      - name: Commit changed public records
        run: |
          git add public/data/av_311_complaints.json public/data/av_311_complaints.csv public/data/av_311_complaints_monthly.csv public/data/austin_av_reports.json public/data/austin_av_reports.csv public/data/austin_av_reports_monthly.csv public/data/austin_av_reports_resident_issues.csv public/data/austin_av_reports_reporter_types.csv
          if ! git diff --cached --quiet; then
            git config user.name "AV Observatory Data Bot"
            git config user.email "actions@users.noreply.github.com"
            git commit -m "Refresh validated AV 311 requests"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Deploy updated site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pushes made with GITHUB_TOKEN do not trigger the push-based Pages deploy.
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            gh workflow run pages.yml --ref main
          else
            echo "No new data commit; no deploy needed"
          fi
