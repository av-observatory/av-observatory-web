name: Refresh serious-crash media links

on:
  schedule:
    - cron: "47 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: website-data-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: pip install --quiet numpy
      - name: Match news coverage to serious SGO crashes and re-run the trend-shift analysis (no AI)
        run: |
          python3 scripts/refresh-sgo-media.py
          python3 scripts/analyze-sgo-shifts.py
          python3 scripts/export-data-csv.py
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/data/sgo_serious_media_links.json public/data/sgo_shift_analysis.json public/data/sgo_shift_analysis_*.csv public/data/sgo_serious_media_links.csv
          if git diff --cached --quiet; then
            echo "No new headlines."
            exit 0
          fi
          git config user.name "AV Observatory Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: refresh serious-crash media links"
          bash scripts/push-main.sh main
          gh workflow run pages.yml --ref main
