name: Probe failed scan fetches
on:
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated states whose failed scan rows are re-fetched and diagnosed"
        default: "MO,PA,SC,RI,WA,NC"
permissions:
  contents: read
jobs:
  probe-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 scripts/probe-scan.py "${{ inputs.states }}"
