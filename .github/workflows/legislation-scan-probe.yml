name: Probe failed scan fetches
on:
  workflow_dispatch:
    inputs:
      states:
        description: "Comma-separated states whose failed scan rows are re-fetched and diagnosed"
        default: ""
      titleonly:
        description: "Also explore summary endpoints for the title-only states"
        default: "false"
      pa:
        description: "Probe palegis.us (Pennsylvania) timeouts"
        default: "false"
      titleonly2:
        description: "Round 2: field names and text URLs for the title-only states"
        default: "false"
permissions:
  contents: read
jobs:
  probe-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - if: ${{ inputs.states != '' }}
        run: python3 scripts/probe-scan.py "${{ inputs.states }}"
      - if: ${{ inputs.titleonly == 'true' }}
        run: python3 scripts/probe-titleonly.py
      - if: ${{ inputs.pa == 'true' }}
        run: python3 scripts/probe-pa.py
      - if: ${{ inputs.titleonly2 == 'true' }}
        run: python3 scripts/probe-titleonly2.py
