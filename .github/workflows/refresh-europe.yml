name: Refresh Europe crash media watch

on:
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: website-data-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Collect new European AV crash headlines (no AI)
        run: |
          python3 scripts/refresh-europe-leads.py
          python3 scripts/export-data-csv.py
          python3 scripts/export-data-csv.py --check
      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/data/europe_crash_tracker*
          if git diff --cached --quiet; then
            echo "No new headlines."
            exit 0
          fi
          git config user.name "AV Observatory Data Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: refresh Europe crash media watch"
          bash scripts/push-main.sh main
          gh workflow run pages.yml --ref main
