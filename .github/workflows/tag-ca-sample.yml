name: "Tag a California sample with the approved taxonomy (for review)"

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Number of bills"
        default: "50"
      model:
        description: "Model id"
        default: "claude-sonnet-5-5"
      out:
        description: "Output file name"
        default: "tags_sample.json"

permissions:
  contents: write

concurrency:
  group: tag-ca-sample-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag the sample
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAG_MODEL: ${{ inputs.model }}
        run: python3 scripts/tag-bills-taxonomy.py --sample "${{ inputs.sample }}" --out "data-state/states/CA/${{ inputs.out }}"
      - name: Commit the sample
        run: COMMIT_PATH=data-state/states/CA bash scripts/commit-ledgers.sh "California taxonomy tagging sample"
