name: Extract Washington legislature data (bills, sponsors, votes, summaries)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe or extract"
        default: "extract"
      limit:
        description: "max bills (0 = all)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: extract-wa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Extract Washington data
        if: ${{ inputs.mode != 'probe' }}
        env:
          COMMIT_PATH: data-state/states/WA
        run: |
          mkdir -p data-state/states/WA
          bash scripts/live-commit.sh python3 -u scripts/extract-wa-legislature.py --limit "${{ inputs.limit }}"
      - name: Commit the extracted files
        if: ${{ inputs.mode != 'probe' }}
        run: |
          ls -l data-state/states/WA
          python3 scripts/check-state-extract.py WA || true
          COMMIT_PATH=data-state/states/WA bash scripts/commit-ledgers.sh "Washington legislature data"
